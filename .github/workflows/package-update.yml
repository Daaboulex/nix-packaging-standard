name: Package update
on:
  workflow_call:
    inputs:
      cadence:
        description: "daily or weekly (Sunday); a dispatched run always runs"
        type: string
        default: daily

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      LOG: /tmp/log-update.log
    outputs:
      run: ${{ steps.cadence.outputs.run }}
      exit_code: ${{ steps.update.outputs.exit_code }}
      updated: ${{ steps.update.outputs.updated }}
      old_version: ${{ steps.update.outputs.old_version }}
      new_version: ${{ steps.update.outputs.new_version }}
      package_name: ${{ steps.update.outputs.package_name }}
      auto_added: ${{ steps.update.outputs.auto_added }}
      upstream_url: ${{ steps.update.outputs.upstream_url }}
      error_type: ${{ steps.update.outputs.error_type }}
      stalled: ${{ steps.streak.outputs.stalled }}
      sha: ${{ steps.candidate.outputs.sha }}
      runners: ${{ steps.runners.outputs.runners }}
    steps:
      - name: Apply the repository's update cadence
        id: cadence
        env:
          CADENCE: ${{ inputs.cadence }}
          EVENT: ${{ github.event_name }}
        run: |
          dow=$(date -u +%u)
          case "$CADENCE" in
          daily) run=yes ;;
          weekly) if [ "$dow" = 7 ]; then run=yes; else run=no; fi ;;
          *)
            echo "::error::cadence '$CADENCE' is neither daily nor weekly; fix the UPDATE_CADENCE repository variable"
            exit 1
            ;;
          esac
          if [ "$EVENT" = workflow_dispatch ]; then run=yes; fi
          echo "cadence=$CADENCE dow=$dow event=$EVENT -> run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &fetch-std
        name: Fetch the standard at the commit that defines this workflow
        env:
          STD_REPOSITORY: ${{ job.workflow_repository }}
          STD_SHA: ${{ job.workflow_sha }}
        run: |
          set -o pipefail
          if [ -z "$STD_REPOSITORY" ] || [ -z "$STD_SHA" ]; then
            echo "::error::job.workflow_repository='$STD_REPOSITORY' job.workflow_sha='$STD_SHA': this runner does not name the commit of the reusable workflow, so its scripts cannot be fetched at that commit"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/std"
          curl -fsSL --retry 5 --retry-all-errors "https://codeload.github.com/$STD_REPOSITORY/tar.gz/$STD_SHA" |
            tar -xz --strip-components=1 -C "$RUNNER_TEMP/std"
          echo "STD=$RUNNER_TEMP/std" >>"$GITHUB_ENV"
          echo "running the scripts of $STD_REPOSITORY at $STD_SHA"
      - if: steps.cadence.outputs.run == 'yes'
        uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060 # v3.23.2
        with:
          extra-conf: lazy-trees = false

      - name: Allow unprivileged user namespaces, which bwrap needs to run a verified binary
        if: steps.cadence.outputs.run == 'yes'
        run: |
          for knob in kernel.apparmor_restrict_unprivileged_userns kernel.apparmor_restrict_unprivileged_unconfined; do
            f="/proc/sys/${knob//.//}"
            [ -e "$f" ] || continue
            sudo sysctl -w "$knob=0"
          done
          unshare --user --map-root-user true || {
            echo "::error::this runner refuses an unprivileged user namespace, so nothing wrapped in bwrap can be verified here"
            exit 1
          }

      - name: Run the updater, retrying only a transient fetch failure
        id: update
        if: steps.cadence.outputs.run == 'yes'
        run: |
          set +e
          if [ "$(jq -r '.upstream.type' .github/update.json)" = custom ]; then
            updater=scripts/update.sh
          else
            updater="$STD/update.sh"
          fi
          echo "updater: $updater"
          attempt=$(mktemp)
          run_update() {
            bash "$updater" 2>&1 | tee "$attempt"
            local rc="${PIPESTATUS[0]}"
            cat "$attempt" >>"$LOG"
            return "$rc"
          }
          transient_fetch_failure='crates\.io|error: cannot download|unable to download|http error 5[0-9][0-9]|status code: (403|429|5[0-9][0-9])|curl: \(|couldn.t resolve host|connection reset by peer|temporary failure in name resolution|operation timed out'
          run_update
          EXIT_CODE=$?
          for backoff in 60 300 900; do
            [ "$EXIT_CODE" -eq 0 ] && break
            grep -qiE "$transient_fetch_failure" "$attempt" || break
            echo "::warning::Transient external-fetch failure during update; retrying in ${backoff}s."
            sleep "$backoff"
            run_update
            EXIT_CODE=$?
          done
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ -f /tmp/update-outputs.env ]; then
            cat /tmp/update-outputs.env >> "$GITHUB_OUTPUT"
          fi

      - name: Restore the transient-exit streak
        if: steps.cadence.outputs.run == 'yes'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/update-streak
          key: update-streak-${{ github.run_id }}
          restore-keys: update-streak-
      - name: Count consecutive transient exits, escalating a week of them as stalled
        id: streak
        if: steps.cadence.outputs.run == 'yes'
        env:
          EXIT_CODE: ${{ steps.update.outputs.exit_code }}
        run: |
          n=0
          if [ -f /tmp/update-streak ] && [[ "$(cat /tmp/update-streak)" =~ ^[0-9]+$ ]]; then
            n=$(cat /tmp/update-streak)
          fi
          if [ "$EXIT_CODE" = "2" ]; then n=$((n + 1)); else n=0; fi
          echo "$n" > /tmp/update-streak
          echo "streak=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -ge 7 ]; then
            echo "::error::the updater has exited 2 (transient, retry next run) on ${n} consecutive runs; a permanent failure is hiding behind the transient exit"
            echo "stalled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the transient-exit streak
        if: steps.cadence.outputs.run == 'yes'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/update-streak
          key: update-streak-${{ github.run_id }}

      - name: Record the candidate
        id: candidate
        if: steps.update.outputs.updated == 'true' || steps.update.outputs.exit_code == '1'
        run: |
          sha=$(git rev-parse HEAD)
          git add -A ':!AI-*.json'
          git diff --cached --binary > /tmp/candidate.patch
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Name a runner for every other declared system
        id: runners
        if: steps.update.outputs.updated == 'true' && steps.update.outputs.exit_code == '0'
        run: |
          built=$(nix eval --impure --raw --expr 'builtins.currentSystem')
          runners=$(bash "$STD/declared-runners.sh" "$built")
          echo "runners=$runners" >> "$GITHUB_OUTPUT"
      - if: steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate
          path: /tmp/candidate.patch
          if-no-files-found: error
      - name: Keep the update log for the report
        if: always() && steps.cadence.outputs.run == 'yes'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: log-update
          path: ${{ env.LOG }}

  verify:
    needs: update
    if: needs.update.outputs.runners != '' && needs.update.outputs.runners != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.update.outputs.runners) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      LOG: /tmp/log-${{ matrix.os }}.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.sha }}
      - uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060 # v3.23.2
        with:
          extra-conf: |
            lazy-trees = false
            keep-outputs = true
            keep-derivations = true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: /tmp/candidate

      - name: Apply the candidate
        run: git apply --index /tmp/candidate/candidate.patch

      - name: Restore the Nix store of the newest earlier run, saved again under this lock
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 8G

      - name: Build every check for this system, retrying only a transient fetch failure
        run: |
          SYS=$(nix eval --impure --raw --expr 'builtins.currentSystem')
          attempt=$(mktemp)
          build() {
            nix run --inputs-from . nixpkgs#nix-fast-build -- --skip-cached --no-nom --flake ".#checks.$SYS" 2>&1 | tee "$attempt"
            local rc="${PIPESTATUS[0]}"
            cat "$attempt" >>"$LOG"
            return "$rc"
          }
          set +e
          build
          code=$?
          transient='crates\.io|error: cannot download|unable to download|http error 5[0-9][0-9]|status code: (403|429|5[0-9][0-9])|curl: \(|couldn.t resolve host|connection reset by peer|temporary failure in name resolution|operation timed out'
          for backoff in 60 300 900; do
            [ "$code" -eq 0 ] && break
            grep -qiE "$transient" "$attempt" || break
            echo "::warning::Transient external-fetch failure during the update build; retrying in ${backoff}s."
            sleep "$backoff"
            build
            code=$?
          done
          exit "$code"

      - name: Keep the build log for the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: log-${{ matrix.os }}
          path: ${{ env.LOG }}

  finish:
    needs: [update, verify]
    if: always() && needs.update.result == 'success' && needs.update.outputs.run == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUCCEEDED: ${{ needs.update.outputs.exit_code == '0' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') }}
      FAILED: ${{ needs.update.outputs.exit_code == '1' || needs.update.outputs.stalled == 'true' || needs.verify.result == 'failure' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.update.outputs.sha }}
      - *fetch-std
      - if: needs.update.outputs.sha != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate
          path: /tmp/candidate

      - name: Push the verified update
        if: env.SUCCEEDED == 'true' && needs.update.outputs.updated == 'true'
        env:
          OLDV: ${{ needs.update.outputs.old_version }}
          NEWV: ${{ needs.update.outputs.new_version }}
          PKG: ${{ needs.update.outputs.package_name }}
          AUTO_ADDED: ${{ needs.update.outputs.auto_added }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git apply --index /tmp/candidate/candidate.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          if [ -n "${AUTO_ADDED}" ]; then
            git commit -m "chore: update ${PKG} ${OLDV} -> ${NEWV}" \
              -m "New upstream python requirement(s) added to the env: ${AUTO_ADDED}."
          else
            git commit -m "chore: update ${PKG} ${OLDV} -> ${NEWV}"
          fi
          git push origin "HEAD:refs/heads/$BRANCH"

      - name: Close the update-failed issues this clean run resolves
        if: env.SUCCEEDED == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 (node24)
        env:
          NEW_VERSION: ${{ needs.update.outputs.new_version }}
          DID_UPDATE: ${{ needs.update.outputs.updated }}
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              labels: 'update-failed', state: 'open'
            });
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = process.env.DID_UPDATE === 'true'
              ? `Resolved by the update to ${process.env.NEW_VERSION} in ${run}.`
              : `Resolved: the update path completes cleanly in ${run} (upstream version unchanged).`;
            for (const issue of issues.data) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: 'closed',
                state_reason: 'completed'
              });
            }

      - name: Apply the attempted update
        if: env.FAILED == 'true' && needs.update.outputs.sha != ''
        run: |
          if [ -s /tmp/candidate/candidate.patch ]; then
            git apply --index /tmp/candidate/candidate.patch
          fi
      - if: env.FAILED == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: log-*
          path: /tmp/logs
          merge-multiple: true

      - name: Gather the failure logs
        if: env.FAILED == 'true'
        run: |
          : >/tmp/update.log
          found=0
          for f in /tmp/logs/log-*.log; do
            [ -f "$f" ] || continue
            found=1
            printf '=== %s\n' "$(basename "$f" .log)" >>/tmp/update.log
            cat "$f" >>/tmp/update.log
          done
          if [ "$found" = 0 ]; then
            echo "No log reached the report: the download found no log-*.log file." >>/tmp/update.log
          fi

      - name: Classify the failure
        id: classify
        if: env.FAILED == 'true'
        run: bash "$STD/classify-build-failure.sh" /tmp/update.log

      - name: Report the failure
        id: report
        if: env.FAILED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ERROR_TYPE: ${{ (needs.verify.result == 'failure' && 'build-error') || needs.update.outputs.error_type || (needs.update.outputs.stalled == 'true' && 'stalled') || '' }}
          OTHER_SYSTEM_FAILED: ${{ needs.verify.result == 'failure' }}
          OLD_VERSION: ${{ needs.update.outputs.old_version }}
          NEW_VERSION: ${{ needs.update.outputs.new_version }}
          UPSTREAM_URL: ${{ needs.update.outputs.upstream_url }}
          PKG: ${{ needs.update.outputs.package_name }}
          FAIL_CLASS: ${{ steps.classify.outputs.class }}
          FAIL_EVIDENCE: ${{ steps.classify.outputs.evidence }}
          FAILED_ATTRS: ${{ steps.classify.outputs.failed_attrs }}
          FAILED_DRVS: ${{ steps.classify.outputs.failed_drvs }}
        run: |
          error_type="${ERROR_TYPE:-unknown}"
          pkg="${PKG:-${GITHUB_REPOSITORY#*/}}"
          versions=""
          if [ -n "$OLD_VERSION$NEW_VERSION" ]; then
            versions=" ${OLD_VERSION:-(current version not read)} -> ${NEW_VERSION:-(target version not read)}"
          fi
          title_class="$error_type"
          if [ -n "$FAIL_CLASS" ] && [ "$FAIL_CLASS" != unclassified ]; then
            title_class="$FAIL_CLASS"
          fi
          title="Update $pkg$versions: $title_class"
          if [ -z "$versions" ]; then
            title="Update $pkg: $title_class (the updater reported no version)"
          fi
          case "$error_type" in
          remirror-needed) heading="Upstream moved past the mirrored commit, a re-mirror is needed" ;;
          stalled) heading="Update stalled, every run for a week exited as transient" ;;
          *) heading="Update failed" ;;
          esac
          branch="update/$pkg-$NEW_VERSION"
          pushed=no
          branch_note=""
          if [ "$error_type" = remirror-needed ] || [ "$error_type" = stalled ]; then
            branch_note=""
          elif [ -z "$NEW_VERSION" ]; then
            branch_note="No attempt branch: the updater reported no target version."
          elif ! git check-ref-format --branch "$branch" >/dev/null; then
            branch_note="No attempt branch: '$branch' is not a valid branch name."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if push_log=$({ git checkout -B "$branch" &&
              git add -A ':!AI-*.json' &&
              git commit -m "wip: attempted update$versions" --allow-empty &&
              git push -f origin "$branch"; } 2>&1); then
              pushed=yes
            else
              printf '%s\n' "$push_log"
              echo "::warning::the attempt branch $branch was not pushed"
              branch_note="The attempt branch $branch could not be pushed: $(printf '%s' "$push_log" | tail -n 3)"
            fi
          fi
          {
            printf '## %s: %s%s\n\n' "$heading" "$pkg" "$versions"
            printf "**Error type**: \`%s\`\n" "$error_type"
            if [ -n "$UPSTREAM_URL" ]; then
              printf '**Upstream**: %s\n' "$UPSTREAM_URL"
            fi
            if [ "$OTHER_SYSTEM_FAILED" = true ]; then
              printf '\nThe update built on the update runner but failed on another declared system; each log section names the runner it came from.\n'
            fi
            if [ "$pushed" = yes ]; then
              fence='```'
              printf '\n### Recovery\n\n%sbash\ngit fetch && git checkout %s\nnix flake check --no-eval-cache && nix build --no-link\ngit checkout main && git merge %s\n%s\n' "$fence" "$branch" "$branch" "$fence"
            fi
            if [ -n "$branch_note" ]; then
              printf '\n%s\n' "$branch_note"
            fi
          } >/tmp/issue-head.md
          bash "$STD/report-failure.sh" update-failed "Update " "$title" /tmp/issue-head.md /tmp/update.log
          echo "error_type=$error_type" >>"$GITHUB_OUTPUT"

      - name: Retire attempt branches that no longer have an open issue, only from the default branch
        if: >-
          ${{ !cancelled()
          && github.ref_name == github.event.repository.default_branch
          && (needs.update.outputs.exit_code == '0' || needs.update.outputs.exit_code == '1') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 (node24)
        env:
          PKG: ${{ needs.update.outputs.package_name }}
          KEEP: ${{ (needs.update.outputs.exit_code == '1' || needs.verify.result == 'failure') && needs.update.outputs.new_version || '' }}
        with:
          script: |
            const pkg = process.env.PKG;
            if (!pkg) {
              core.info('no package_name reported; leaving every branch alone');
              return;
            }
            const keep = process.env.KEEP
              ? `refs/heads/update/${pkg}-${process.env.KEEP}`
              : '';
            const { data: refs } = await github.rest.git.listMatchingRefs({
              owner: context.repo.owner, repo: context.repo.repo,
              ref: `heads/update/${pkg}-`
            });
            const failed = [];
            for (const r of refs) {
              if (r.ref === keep) continue;
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner, repo: context.repo.repo,
                  ref: r.ref.replace('refs/', '')
                });
                core.info(`retired ${r.ref}`);
              } catch (e) {
                if (e.status === 422) {
                  core.info(`${r.ref} was already deleted`);
                  continue;
                }
                failed.push(`${r.ref}: ${e.message}`);
              }
            }
            if (failed.length) {
              core.setFailed(`could not retire ${failed.length} attempt branch(es): ${failed.join('; ')}`);
            }

      - name: Fail the run
        if: ${{ !cancelled() && env.FAILED == 'true' }}
        env:
          ERROR_TYPE: ${{ steps.report.outputs.error_type }}
        run: |
          if [ -n "$ERROR_TYPE" ]; then
            echo "::error::the update did not complete ($ERROR_TYPE); it is reported in the open update-failed issue"
          else
            echo "::error::the update did not complete and the report step did not finish, so no issue records it; read this run's log"
          fi
          exit 1
