name: Maintenance
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  maintenance:
    uses: ./.github/workflows/package-maintenance.yml
    with:
      cadence: ${{ vars.MAINTENANCE_CADENCE || 'weekly' }}
