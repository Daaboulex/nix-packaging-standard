name: Package CI
on:
  workflow_call:
    inputs:
      reclaim-disk:
        description: "on frees about 20 GB of preinstalled toolchains before the build, for a repo whose build outgrows the runner's default disk; off skips it. A caller that passes nothing gets on"
        type: string
        default: "on"

permissions:
  contents: read

jobs:
  no-tracked-ignored-files:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if a tracked file is gitignored
        run: |
          set -eu
          tracked_ignored=$(git ls-files -i -c --exclude-per-directory=.gitignore)
          if [ -n "$tracked_ignored" ]; then
            echo "::error::These tracked files match .gitignore and must not be committed:"
            printf '%s\n' "$tracked_ignored" | while IFS= read -r f; do echo "  - $f"; done
            exit 1
          fi
          echo "Clean -- no tracked file is gitignored."

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      runners: ${{ steps.declared.outputs.runners }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &fetch-std
        name: Fetch the standard at the commit that defines this workflow
        env:
          STD_REPOSITORY: ${{ job.workflow_repository }}
          STD_SHA: ${{ job.workflow_sha }}
        run: |
          set -o pipefail
          if [ -z "$STD_REPOSITORY" ] || [ -z "$STD_SHA" ]; then
            echo "::error::job.workflow_repository='$STD_REPOSITORY' job.workflow_sha='$STD_SHA': this runner does not name the commit of the reusable workflow, so its scripts cannot be fetched at that commit"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/std"
          curl -fsSL --retry 5 --retry-all-errors "https://codeload.github.com/$STD_REPOSITORY/tar.gz/$STD_SHA" |
            tar -xz --strip-components=1 -C "$RUNNER_TEMP/std"
          echo "STD=$RUNNER_TEMP/std" >>"$GITHUB_ENV"
          echo "running the scripts of $STD_REPOSITORY at $STD_SHA"
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          extra-conf: lazy-trees = false
      - name: Refuse an unknown reclaim-disk value
        env:
          RECLAIM: ${{ inputs.reclaim-disk }}
        run: |
          case "$RECLAIM" in
          on | off) echo "reclaim-disk=$RECLAIM" ;;
          *)
            echo "::error::reclaim-disk '$RECLAIM' is neither on nor off; fix the RECLAIM_DISK repository variable"
            exit 1
            ;;
          esac
      - name: Name a runner for every system the flake declares checks on
        id: declared
        run: |
          runners=$(bash "$STD/declared-runners.sh")
          echo "runners=$runners" >> "$GITHUB_OUTPUT"
      - name: Evaluate every declared system with import from derivation forbidden
        run: bash "$STD/evaluate-every-system.sh"

  build:
    needs: [no-tracked-ignored-files, plan]
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.runners) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - *fetch-std
      - uses: DeterminateSystems/determinate-nix-action@16f94ba7aae399b9f9077c254b6719ec6de7e3e3 # v3.24.2
        with:
          extra-conf: |
            lazy-trees = false
            keep-outputs = true
            keep-derivations = true

      - name: Cache the Nix store
        id: nix-cache
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/flake.lock', '**/*.nix') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 8G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-
          purge-last-accessed: P1DT12H
          purge-primary-key: never

      - name: Reclaim runner disk for large source builds
        if: inputs.reclaim-disk == 'on'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          if command -v docker >/dev/null; then
            sudo docker image prune --all --force >/dev/null
          fi
          df -h /

      - name: Check every commit message in the range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash "$STD/scripts/check-commit-messages-ci.sh" "$BASE" "$HEAD"

      - name: Refuse a detection baseline that grew or a coverage floor that dropped
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash "$STD/scripts/check-baselines-shrink.sh" "$BASE" "$HEAD"

      - name: Flag a build-the-world bump
        if: steps.nix-cache.outputs.restored-key != ''
        run: |
          SYS=$(nix eval --impure --raw --expr 'builtins.currentSystem')
          jobs=$(nix run --inputs-from . nixpkgs#nix-eval-jobs -- --flake ".#checks.$SYS")
          mapfile -t D < <(jq -r 'select(.drvPath) | .drvPath' <<<"$jobs")
          [ ${#D[@]} -eq 0 ] && exit 0
          dry=$(nix build "${D[@]/%/^*}" --dry-run --narinfo-cache-negative-ttl 0 2>&1)
          B=$(sed -n 's/^these \([0-9]\+\) derivations will be built.*/\1/p' <<<"$dry")
          B=${B:-0}
          echo "will build from source this run: $B"
          if [ "$B" -gt 5000 ]; then
            echo "::error::$B derivations would build from source -- a flake.lock bump moved far ahead of cache.nixos.org (runaway that would risk the 6h timeout). Investigate the lock, or wait for cache.nixos.org to catch up, before rerunning."
            exit 1
          elif [ "$B" -gt 500 ]; then
            echo "::warning::$B derivations build from source -- a flake.lock bump moved ahead of cache.nixos.org. The store cache absorbs it after this run."
          fi

      - name: Build every check declared for this system, retrying only a transient fetch failure
        run: |
          SYS=$(nix eval --impure --raw --expr 'builtins.currentSystem')
          RETRY_BACKOFFS="60 300" bash "$STD/retry-transient.sh" "$RUNNER_TEMP/build.log" 13200 -- \
            nix run --inputs-from . nixpkgs#nix-fast-build -- --skip-cached --no-nom --flake ".#checks.$SYS"
