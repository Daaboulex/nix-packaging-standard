# Fleet CI watch -- nix-packaging-standard repo ONLY (never synced to
# consumers). A consumer's red CI can otherwise sit silent between fleet-audit
# runs; this weekly sweep reads every consumer's latest run that did work per
# required workflow on its default branch, whether its schedule still fires, and
# its open failure issues, and keeps exactly ONE open issue here naming the red
# or missing ones, closing it when the fleet is clean.
name: Fleet CI watch
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9 (node24)
        with:
          script: |
            const owner = context.repo.owner;
            const repos = await github.paginate(github.rest.repos.listForUser, {
              username: owner, per_page: 100
            });
            const bad = [];
            for (const r of repos) {
              if (r.archived) continue;
              // A consumer carries .github/update.json on its default branch.
              let updateJson;
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo: r.name, path: '.github/update.json' });
                updateJson = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              } catch (e) {
                if (e.status === 404) continue;
                throw e;
              }
              for (const label of ['update-failed', 'maintenance']) {
                const issues = await github.rest.issues.listForRepo({
                  owner, repo: r.name, labels: label, state: 'open'
                });
                for (const i of issues.data) {
                  bad.push(`${r.name}: open ${label} issue #${i.number} since ${i.created_at.slice(0, 10)}: ${i.title}`);
                }
              }
              let lock;
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo: r.name, path: 'flake.lock' });
                lock = JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              const std = lock && lock.nodes && lock.nodes.std;
              if (!std) {
                bad.push(`${r.name}: flake.lock has no std input`);
              } else if (std.original.ref !== 'release') {
                bad.push(`${r.name}: std follows ${std.original.ref ? `ref ${std.original.ref}` : 'no ref'}, not the release branch, so no lock refresh moves it`);
              }
              const required = updateJson.upstream.type === 'none'
                ? ['ci.yml', 'maintenance.yml']
                : ['ci.yml', 'maintenance.yml', 'update.yml'];
              for (const wf of required) {
                let verdict = 'missing';
                try {
                  const runs = await github.rest.actions.listWorkflowRuns({
                    owner, repo: r.name, workflow_id: wf,
                    branch: r.default_branch, per_page: 30
                  });
                  const own = runs.data.workflow_runs.filter(x =>
                    x.event !== 'pull_request'
                    && x.head_repository && x.head_repository.full_name === r.full_name);
                  const run = own.find(x => x.conclusion !== 'skipped');
                  const days = own.length > 0 ? (Date.now() - Date.parse(own[0].created_at)) / 86400000 : 0;
                  if (wf !== 'ci.yml' && days > 3) verdict = `no run for ${Math.floor(days)} days, so its daily schedule no longer fires`;
                  else if (run) verdict = run.conclusion || run.status;
                  else if (own.length > 0) verdict = `skipped on each of its last ${own.length} runs, so it did no work in that window`;
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
                // A run still in flight is not a defect; flag real reds and holes.
                if (!['success', 'in_progress', 'queued', 'waiting', 'pending'].includes(verdict)) {
                  bad.push(`${r.name}: ${wf} = ${verdict}`);
                }
              }
            }
            const title = 'Fleet: red or missing CI on consumers';
            const open = await github.rest.issues.listForRepo({
              owner, repo: context.repo.repo, state: 'open'
            });
            const existing = open.data.find(i => i.title === title);
            if (bad.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner, repo: context.repo.repo, issue_number: existing.number,
                  body: 'Fleet clean on this sweep; closing.'
                });
                await github.rest.issues.update({
                  owner, repo: context.repo.repo, issue_number: existing.number,
                  state: 'closed', state_reason: 'completed'
                });
              }
              return;
            }
            const body = [
              'Open failure issues, and each required workflow on the default branch whose latest run that did work is not green or whose schedule stopped:',
              '',
              ...bad.map(b => `- ${b}`),
              '',
              'Filed by the weekly Fleet CI watch (.github/workflows/fleet-watch.yml);',
              'it updates this issue each sweep and closes it when the fleet is clean.'
            ].join('\n');
            if (existing) {
              await github.rest.issues.update({
                owner, repo: context.repo.repo, issue_number: existing.number, body
              });
            } else {
              await github.rest.issues.create({
                owner, repo: context.repo.repo, title, body
              });
            }
